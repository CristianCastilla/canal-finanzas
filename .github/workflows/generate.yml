name: Generar guiones

on:
  schedule:
    - cron: "0 5 * * 0" # domingos 05:00 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: "Qué generar"
        type: choice
        options: [weekly, long, short]
        default: weekly

permissions:
  contents: write

concurrency:
  group: generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Generar guiones
        env:
          MODE: ${{ inputs.mode || 'weekly' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUTF8: "1"
        run: |
          case "$MODE" in
            long)  python -m src.main generate --format long ;;
            short) python -m src.main generate --format short --count 2 ;;
            *)     python -m src.main generate --weekly ;;
          esac

      - name: Guardar la cola en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/queue.json
          if git diff --cached --quiet; then
            echo "Sin cambios en la cola."
          else
            git commit -m "guiones: $(date -u +%F)"
            git push
          fi
