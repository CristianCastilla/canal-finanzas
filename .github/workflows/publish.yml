name: Renderizar y publicar

on:
  schedule:
    - cron: "0 14 * * *" # todos los días 14:00 UTC
  workflow_dispatch:
    inputs:
      id:
        description: "ID del guion (vacío = siguiente aprobado)"
        required: false
      force:
        description: "Permitir publicar un borrador"
        type: boolean
        default: false
      upload:
        description: "Subir a YouTube (desmarca para solo renderizar)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar FFmpeg y fuentes
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu fonts-liberation

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Comprobar el entorno
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: python -m src.main doctor

      - name: Renderizar y subir
        env:
          ITEM_ID: ${{ inputs.id }}
          FORCE: ${{ inputs.force }}
          UPLOAD: ${{ inputs.upload }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUTF8: "1"
        run: |
          UPLOAD_FLAG=""
          if [ "$UPLOAD" = "false" ]; then
            UPLOAD_FLAG="--no-upload"
            echo "Modo solo render: no se sube a YouTube."
          fi
          if [ -n "$ITEM_ID" ]; then
            if [ "$FORCE" = "true" ]; then
              python -m src.main publish "$ITEM_ID" --force $UPLOAD_FLAG
            else
              python -m src.main publish "$ITEM_ID" $UPLOAD_FLAG
            fi
          else
            python -m src.main run --limit 1 $UPLOAD_FLAG
          fi

      - name: Guardar vídeo y miniatura como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_id }}
          path: out/**/*
          if-no-files-found: ignore
          retention-days: 7

      - name: Guardar estado en el repositorio
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/queue.json
          if git diff --cached --quiet; then
            echo "Sin cambios en la cola."
          else
            git commit -m "publicacion: $(date -u +%F)"
            git push
          fi
