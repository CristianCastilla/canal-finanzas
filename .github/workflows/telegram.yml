name: Aprobaciones Telegram

on:
  schedule:
    - cron: "0 * * * *" # cada hora
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias mínimas
        run: pip install -q requests PyYAML

      - name: Procesar botones
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUTF8: "1"
        run: python -m src.main telegram

      - name: Guardar estado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "telegram: $(date -u +%F-%H)"
            git push
          fi
